<div class="sidebar-bottom">
      <div class="help-card">
        <span class="help-star">✳</span><b>Un ciclo más claro.</b>
        <p>Tu información académica, conectada en un mismo espacio.</p>
      </div>

      <div class="sidebar-user">
        <span class="avatar">{{ auth.user()?.firstName?.charAt(0) }}{{ auth.user()?.lastName?.charAt(0) }}</span>
        <span class="user-label">
          <b>{{ auth.user()?.firstName }} {{ auth.user()?.lastName }}</b>
          <small>{{ auth.user()?.role === 'ADMIN' ? 'Administración' : 'Docente' }}</small>
        </span>
        <!-- Botón único y unificado: elegante en PC y compacto en móvil -->
        <button 
          type="button" 
          class="logout-button flex items-center justify-center p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors cursor-pointer" 
          (click)="auth.logout()" 
          aria-label="Cerrar sesión" 
          title="Cerrar sesión">
          <!-- Icono de flecha visible en PC -->
          <span class="hidden sm:inline">↗</span>
          <!-- Texto/Icono de salida compacto visible solo en móvil -->
          <span class="sm:hidden text-xs font-bold flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
          </span>
        </button>
      </div>
    </div>
